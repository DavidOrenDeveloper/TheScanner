<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f3d5e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>כתב כמויות ומפרט</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#eef1f5;color:#1b2430;font-size:16px}
header{background:#0f3d5e;color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0003}header h1{font-size:18px;margin:0;padding:12px 16px}
nav{display:flex;background:#0b2f49}nav button{flex:1;background:none;border:0;color:#b8cee0;padding:12px 6px;font:inherit;font-size:15px;border-bottom:3px solid transparent;cursor:pointer}nav button.on{color:#fff;border-color:#ffc83d;background:#12486e}
main{max-width:1150px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:12px}.grid .card{margin:0}
input,select,textarea{width:100%;padding:11px;border:1px solid #b9c3cf;border-radius:10px;font:inherit;margin:4px 0;background:#fff}input.big{font-size:18px}textarea{min-height:64px}
button.b{background:#0f3d5e;color:#fff;border:0;border-radius:10px;padding:10px 14px;margin:3px;font:inherit;cursor:pointer}button.b:hover{background:#17598a}button.big{font-size:17px;padding:11px 20px}button.g{background:#e3e9ef;color:#0f3d5e}button.r{background:#b3261e}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto;min-width:0}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:#e3e9ef;margin-inline-end:5px}.s-חזקה{background:#c8efd4}.s-בינונית{background:#fff0b3}.s-חלשה{background:#f6d0cc}
.src{font-size:13px;color:#456}.why{font-size:12px;color:#765}.txt{white-space:pre-wrap;margin:8px 0;line-height:1.5}.cnt{margin:8px 2px}mark{background:#ffe27a;border-radius:3px;padding:0 2px}
.warn{background:#fff6dd;border-inline-start:4px solid #ffc83d;padding:9px;font-size:13px;margin:10px 0;border-radius:6px}
.chips{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chip{background:#fff;border:1px solid #9fb4c7;color:#0f3d5e;border-radius:18px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}.chip:hover{background:#e3eef8}
.dz{display:block;border:3px dashed #7f9db5;border-radius:16px;background:#fff;text-align:center;padding:30px 12px;cursor:pointer;margin:10px 0}.dz:hover{background:#eaf3fa}.dzi{font-size:42px}
details.intro{background:#e8f2fb;border-radius:12px;padding:10px 14px;margin:10px 0}details.intro summary{cursor:pointer;font-weight:600;color:#0f3d5e}details.intro p{line-height:1.6;margin:8px 0}
#drop{display:none;position:fixed;inset:0;background:#0f3d5ecc;color:#fff;font-size:28px;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#toast{position:fixed;bottom:14px;left:14px;right:14px;max-width:520px;margin:auto;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9;text-align:center}
dialog{border:0;border-radius:14px;padding:18px;max-width:92vw;width:400px}
@media(max-width:700px){nav{position:fixed;bottom:0;left:0;right:0;z-index:6;box-shadow:0 -2px 8px #0004}nav button{font-size:12px;padding:8px 2px}main{padding-bottom:78px}#toast{bottom:70px}}
@media(min-width:1000px){header{display:flex;align-items:center}header h1{flex:0 0 auto}nav{background:none;flex:1;justify-content:flex-end;max-width:700px;margin-inline-start:auto}}
@media print{header,.noprint,button,#toast,details,.chips,.dz{display:none!important}.card{box-shadow:none;border:1px solid #999;break-inside:avoid}.grid{display:block}}
</style></head><body><header class="noprint"><h1>⚡ כתב כמויות ומפרט – גולדין / אתר עד 120</h1><nav id="nav"></nav></header><main id="main"></main><div id="toast"></div><dialog id="dlg"></dialog><div id="drop">📥 שחרר כאן להעלאה</div>
<script src="lib/xlsx.full.min.js"></script><script src="lib/pdf.min.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
