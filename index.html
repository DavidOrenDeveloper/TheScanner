<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f3d5e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>כתב כמויות ומפרט</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f5f8;color:#1b2430}
header{background:#0f3d5e;color:#fff;position:sticky;top:0;z-index:5}header h1{font-size:17px;margin:0;padding:10px 14px}
nav{display:flex;overflow-x:auto}nav button{flex:1;min-width:80px;background:none;border:0;color:#cfe0ee;padding:10px 6px;font-size:14px;border-bottom:3px solid transparent}nav button.on{color:#fff;border-color:#ffc83d}
main{max-width:900px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}
input,select,textarea{width:100%;padding:9px;border:1px solid #b9c3cf;border-radius:8px;font:inherit;margin:4px 0}textarea{min-height:60px}
button.b{background:#0f3d5e;color:#fff;border:0;border-radius:8px;padding:8px 12px;margin:3px;font:inherit}button.g{background:#e3e9ef;color:#0f3d5e}button.r{background:#b3261e}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e3e9ef;margin-inline-end:4px}.s-חזקה{background:#c8efd4}.s-בינונית{background:#fff0b3}.s-חלשה{background:#f6d0cc}
.src{font-size:13px;color:#456}.why{font-size:12px;color:#765}.txt{white-space:pre-wrap;margin:6px 0}.warn{background:#fff6dd;border-inline-start:4px solid #ffc83d;padding:8px;font-size:13px;margin:8px 0}
#toast{position:fixed;bottom:14px;left:14px;right:14px;background:#222;color:#fff;padding:10px;border-radius:8px;display:none;z-index:9;text-align:center}
dialog{border:0;border-radius:12px;padding:16px;max-width:92vw;width:380px}
@media print{header,.noprint,button,#toast{display:none!important}.card{box-shadow:none;border:1px solid #999;break-inside:avoid}}
</style></head><body><header class="noprint"><h1>⚡ כתב כמויות ומפרט – גולדין / אתר עד 120</h1><nav id="nav"></nav></header><main id="main"></main><div id="toast"></div><dialog id="dlg"></dialog>
<script src="lib/xlsx.full.min.js"></script><script src="lib/pdf.min.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
